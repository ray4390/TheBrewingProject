name: Build and test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - 'raycraft/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Clean build and run all tests
        run: ./gradlew clean build --no-daemon

      - name: Download pinned optional integration dependency
        run: |
          curl --fail --location --retry 3 --output PlaceholderAPI-2.12.3.jar \
            https://cdn.modrinth.com/data/lKEzGugV/versions/pIvQcXW8/PlaceholderAPI-2.12.3.jar
          echo "fde03259f5af6938f3c33eeb4d814000a1adabf1d2304ce14970be81f609a437  PlaceholderAPI-2.12.3.jar" | sha256sum --check

      - name: Paper 26.3 build 134 lifecycle and upgrade fixture test
        shell: bash
        run: |
          plugin_jar=$(find bukkit-impl/build/libs -maxdepth 1 -name 'TheBrewingProject-*.jar' -print -quit)
          python3 scripts/test-paper-26.3.py --jar "$plugin_jar" --java "$JAVA_HOME/bin/java"

      - name: Paper 26.3 build 134 PlaceholderAPI integration test
        shell: bash
        run: |
          plugin_jar=$(find bukkit-impl/build/libs -maxdepth 1 -name 'TheBrewingProject-*.jar' -print -quit)
          python3 scripts/test-paper-26.3.py --jar "$plugin_jar" --java "$JAVA_HOME/bin/java" --optional-plugin PlaceholderAPI-2.12.3.jar

      - name: ChestShop 3.13-pre-1 native integration lifecycle test
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find "$HOME/.gradle/caches/modules-2/files-2.1/maven.modrinth/QI2CAnAl/YNfN5x9T" -type f -name '*.jar' -print)
          test "${#candidates[@]}" -eq 1
          cp "${candidates[0]}" ChestShop-3.13-pre-1.jar
          sha256sum ChestShop-3.13-pre-1.jar
          # ChestShop intentionally disables itself without an economy. Use
          # real, checksum-pinned economy plugins in this disposable harness.
          python3 scripts/ci-chestshop-deps.py
          plugin_jar=$(find bukkit-impl/build/libs -maxdepth 1 -name 'TheBrewingProject-*.jar' -print -quit)
          python3 scripts/test-paper-26.3.py --jar "$plugin_jar" --java "$JAVA_HOME/bin/java" \
            --optional-plugin ChestShop-3.13-pre-1.jar \
            --optional-plugin VaultUnlocked-2.20.3.jar \
            --optional-plugin EssentialsX-2.22.0.jar \
            --require-startup-log "Recipe-based ChestShops enabled"

      - name: Verify and checksum deployable JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find bukkit-impl/build/libs -maxdepth 1 -type f -name 'TheBrewingProject-*.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one deployable JAR, found %s\\n' "${#jars[@]}" >&2
            printf '%s\\n' "${jars[@]}" >&2
            exit 1
          fi
          sha256sum "${jars[0]}" | tee brewing-project.sha256
          echo "artifact_sha256=$(sha256sum "${jars[0]}" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve qualified plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: TheBrewingProject-Paper-26.3-build-134
          path: |
            bukkit-impl/build/libs/TheBrewingProject-*.jar
            brewing-project.sha256
          if-no-files-found: error
