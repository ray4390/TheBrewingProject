name: Build and test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - 'raycraft/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Clean build and run all tests
        run: ./gradlew clean build --no-daemon

      - name: Download pinned integration dependencies
        run: |
          curl --fail --location --retry 3 --output paper-26.2-126.jar \
            https://fill-data.papermc.io/v1/objects/9c95eb088b903d9ed96cd457838f3078f02407a965dc8ae36d2c4e551a04355a/paper-26.2-126.jar
          echo "9c95eb088b903d9ed96cd457838f3078f02407a965dc8ae36d2c4e551a04355a  paper-26.2-126.jar" | sha256sum --check
          curl --fail --location --retry 3 --output PlaceholderAPI-2.12.3.jar \
            https://cdn.modrinth.com/data/lKEzGugV/versions/pIvQcXW8/PlaceholderAPI-2.12.3.jar
          echo "fde03259f5af6938f3c33eeb4d814000a1adabf1d2304ce14970be81f609a437  PlaceholderAPI-2.12.3.jar" | sha256sum --check

      - name: Paper 26.2 lifecycle and upgrade fixture test
        shell: bash
        run: |
          plugin_jar=$(find bukkit-impl/build/libs -maxdepth 1 -name 'TheBrewingProject-*.jar' -print -quit)
          python3 scripts/test-paper-26.2.py --jar "$plugin_jar" --java "$JAVA_HOME/bin/java" --paper-jar paper-26.2-126.jar

      - name: Paper 26.2 PlaceholderAPI integration test
        shell: bash
        run: |
          plugin_jar=$(find bukkit-impl/build/libs -maxdepth 1 -name 'TheBrewingProject-*.jar' -print -quit)
          python3 scripts/test-paper-26.2.py --jar "$plugin_jar" --java "$JAVA_HOME/bin/java" --paper-jar paper-26.2-126.jar --optional-plugin PlaceholderAPI-2.12.3.jar

      - name: Preserve production plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: TheBrewingProject-Paper-26.2
          path: bukkit-impl/build/libs/TheBrewingProject-*.jar
          if-no-files-found: error
