name: Build and test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - 'raycraft/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean build and run all tests
        run: ./gradlew clean build --no-daemon

      - name: Preserve production plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: TheBrewingProject-Paper-26.2
          path: bukkit-impl/build/libs/TheBrewingProject-*.jar
          if-no-files-found: error
